<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2536"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="110" y1="152" x2="430" y2="360">
      <stop offset="0" stop-color="#5ef0d0"/>
      <stop offset="1" stop-color="#2aa0ff"/>
    </linearGradient>
    <clipPath id="kclip"><rect x="280" y="152" width="200" height="208"/></clipPath>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Scanner corner brackets -->
  <g fill="none" stroke="#33415c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 140V112a16 16 0 0 1 16-16h28"/>
    <path d="M416 140V112a16 16 0 0 0-16-16h-28"/>
    <path d="M96 372v28a16 16 0 0 0 16 16h28"/>
    <path d="M416 372v28a16 16 0 0 1-16 16h-28"/>
  </g>

  <!-- SK monogram: squared, chamfered letterforms -->
  <g transform="translate(-20 -6)" fill="none" stroke="url(#fg)" stroke-width="40" stroke-linecap="butt">
    <!-- S -->
    <path d="M266 172H178A32 32 0 0 0 146 204V224A32 32 0 0 0 178 256H214A32 32 0 0 1 246 288V308A32 32 0 0 1 214 340H126"/>
    <!-- K -->
    <g transform="translate(8 0)" clip-path="url(#kclip)" stroke-linejoin="miter">
      <path d="M310 152V360"/>
      <path d="M310 256L410 130"/>
      <path d="M310 256L410 382"/>
    </g>
  </g>

  <!-- Memory byte cells -->
  <g transform="translate(150 418)">
    <rect x="0"   y="0" width="22" height="14" rx="4" fill="#33415c"/>
    <rect x="30"  y="0" width="22" height="14" rx="4" fill="#33415c"/>
    <rect x="60"  y="0" width="22" height="14" rx="4" fill="#5ef0d0"/>
    <rect x="90"  y="0" width="22" height="14" rx="4" fill="#33415c"/>
    <rect x="120" y="0" width="22" height="14" rx="4" fill="#2aa0ff"/>
    <rect x="150" y="0" width="22" height="14" rx="4" fill="#33415c"/>
    <rect x="180" y="0" width="22" height="14" rx="4" fill="#33415c"/>
  </g>
</svg>
